[project]
name = "due-diligence-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HenryCNH", email = "124549895+HenryCNH@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling[easyocr]>=2.143.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "sentence-transformers>=6.2.0",
    "structlog>=26.1.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.21.0",
    "typer>=0.26.8",
]

[project.scripts]
due-diligence-rag = "due_diligence_rag:main"
diligence-rag = "due_diligence_rag.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
